<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing Hexagon/Shield shape -->
  <path d="M128 20L230 75V180L128 235L26 180V75L128 20Z" fill="#050505" stroke="#FF0000" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Central Hacker Eye Symbol -->
  <g filter="url(#glow)">
    <path d="M128 70L180 160H76L128 70Z" stroke="#FF0000" stroke-width="6" fill="#0A0A0A" stroke-linecap="round"/>
    <circle cx="128" cy="130" r="12" fill="#FF0000">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg>
