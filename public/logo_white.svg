<svg viewBox="0 0 1400 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feFlood flood-color="#FF0000" flood-opacity="0.8" result="flood" />
      <feComposite in="flood" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="120" fill="#0A0A0A" stroke="#1A1A1A" stroke-width="4"/>

  <g filter="url(#crimsonGlow)">
    <path d="M128 40L190 160L66 160L128 40Z" stroke="#990000" stroke-width="6" fill="#1A1A1A" stroke-linecap="round"/>
    
    <path d="M96 110Q128 90 160 110Q128 130 96 110Z" fill="#101010" stroke="#FF0000" stroke-width="3">
       <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite" />
    </path>
    
    <circle cx="128" cy="110" r="15" fill="#FF0000">
      <animate attributeName="r" values="15;18;15" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <g transform="translate(280, 150)">
    <text font-family="Courier New, monospace" font-weight="900" font-size="95" fill="white" letter-spacing="4">
      <tspan fill="white" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite" />H</tspan>
      <tspan fill="white" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.1;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite" />A</tspan>
      <tspan fill="white" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1;0.15;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite" />C</tspan>
      <tspan fill="white" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.2;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite" />K</tspan>
      <tspan fill="white" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.25;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite" />E</tspan>
      <tspan fill="white" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.3;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite" />R</tspan>
      <tspan fill="#FF0000" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.35;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite" />.</tspan>
      <tspan fill="#FF0000" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite" />A</tspan>
      <tspan fill="#FF0000" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.9;1" calcMode="discrete" dur="5s" repeatCount="indefinite" />I</tspan>
    </text>
    
    <rect x="0" y="25" width="700" height="4" fill="#FF0000" fill-opacity="0.5">
       <animate attributeName="width" values="0;700;700;0" keyTimes="0;0.45;0.9;1" dur="5s" repeatCount="indefinite" />
       <animate attributeName="x" values="0;0;0;700" keyTimes="0;0.45;0.9;1" dur="5s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
