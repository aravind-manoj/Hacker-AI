<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feFlood flood-color="#FF0000" flood-opacity="0.8" result="flood" />
      <feComposite in="flood" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="120" fill="#0A0A0A" stroke="#1A1A1A" stroke-width="4"/>

  <g filter="url(#crimsonGlow)">
    <path d="M128 40L190 160L66 160L128 40Z" stroke="#990000" stroke-width="6" fill="#1A1A1A" stroke-linecap="round"/>
    
    <path d="M96 110Q128 90 160 110Q128 130 96 110Z" fill="#101010" stroke="#FF0000" stroke-width="3">
       <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite" />
    </path>
    
    <circle cx="128" cy="110" r="15" fill="#FF0000">
      <animate attributeName="r" values="15;18;15" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <g transform="translate(128, 205)">
    <text font-family="Verdana, Geneva, sans-serif" font-weight="900" font-size="28" fill="white" text-anchor="middle" letter-spacing="2">
      <tspan fill="white">HACKER</tspan><tspan fill="#FF0000">.AI</tspan>
      
      <animate attributeName="opacity" values="1;0.7;1" dur="5s" repeatCount="indefinite" />
    </text>
    
    <rect x="-64" y="10" width="128" height="2" fill="#FF0000" fill-opacity="0.5">
       <animate attributeName="width" values="0;128;0" dur="4s" repeatCount="indefinite" />
       <animate attributeName="x" values="64;-64;64" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

</svg>
